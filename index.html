<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Release Hub</title>
  <meta name="description" content="Tải bản Dev & Live APK cho ứng dụng Android nội bộ" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ─── Design Tokens ─────────────────────────────────────────── */
    :root {
      --bg:          #0a0f1e;
      --surface:     #111827;
      --surface2:    #1a2236;
      --border:      rgba(255,255,255,0.07);
      --text:        #f1f5f9;
      --text-muted:  #94a3b8;
      --text-faint:  #475569;
      --accent-blue: #3b82f6;
      --accent-green:#22c55e;
      --accent-pur:  #8b5cf6;
      --glow-blue:   rgba(59,130,246,0.25);
      --glow-green:  rgba(34,197,94,0.25);
      --radius:      16px;
      --radius-sm:   10px;
      --radius-xs:   6px;
    }

    /* ─── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Background mesh ─────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(59,130,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(139,92,246,0.10) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Layout ───────────────────────────────────────────────── */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* ─── Header ───────────────────────────────────────────────── */
    header {
      padding: 60px 0 40px;
      text-align: center;
    }
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #93c5fd;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .header-badge .dot {
      width: 6px; height: 6px;
      background: #3b82f6;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
    header h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f1f5f9 30%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    header p {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ─── Stats bar ─────────────────────────────────────────────── */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin: 32px 0;
      flex-wrap: wrap;
    }
    .stat {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-muted);
    }
    .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
    .stat-dot.green { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .stat-dot.blue  { background: var(--accent-blue);  box-shadow: 0 0 6px var(--accent-blue); }

    /* ─── Search / Filter ───────────────────────────────────────── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-faint);
    }
    #searchInput {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px 10px 40px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #searchInput:focus { border-color: rgba(59,130,246,0.5); }
    #searchInput::placeholder { color: var(--text-faint); }

    /* ─── Grid ──────────────────────────────────────────────────── */
    #appGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    /* ─── App Card ──────────────────────────────────────────────── */
    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      animation: fadeUp 0.4s ease both;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .app-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border-color: rgba(255,255,255,0.13);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 0;
    }
    .app-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--surface2), #0d1526);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .app-icon img { width: 100%; height: 100%; object-fit: cover; }

    .app-info { flex: 1; min-width: 0; }
    .app-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 100px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .badge-android {
      background: rgba(34,197,94,0.12);
      color: #4ade80;
      border: 1px solid rgba(34,197,94,0.25);
    }
    .badge-repo {
      background: rgba(139,92,246,0.10);
      color: #a78bfa;
      border: 1px solid rgba(139,92,246,0.2);
      font-size: 10px;
      cursor: pointer;
      text-decoration: none;
    }
    .badge-repo:hover { background: rgba(139,92,246,0.2); }

    /* ─── Screenshots Preview ────────────────────────────────────── */
    .screenshots-preview {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .screenshot-thumb {
      width: 50px;
      height: 80px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .screenshot-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .screenshot-thumb:hover {
      transform: scale(1.05);
      border-color: var(--accent-blue);
    }

    /* ─── Build info ─────────────────────────────────────────────── */
    .builds-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0;
    }
    .builds-row.single { grid-template-columns: 1fr; }
    .build-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .build-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .build-label .indicator {
      width: 7px; height: 7px; border-radius: 50%;
    }
    .indicator.dev  { background: var(--accent-blue);  box-shadow: 0 0 5px var(--glow-blue); }
    .indicator.prod { background: var(--accent-green); box-shadow: 0 0 5px var(--glow-green); }

    .build-version {
      font-size: 11px;
      color: var(--text-faint);
      display: flex; align-items: center; gap: 4px;
    }

    /* ─── Download Button ────────────────────────────────────────── */
    .btn-download {
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
      border: none; border-radius: var(--radius-xs);
      padding: 9px 14px;
      font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: all 0.2s; position: relative; overflow: hidden;
    }
    .btn-download::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.15s;
    }
    .btn-download:hover::after { background: rgba(255,255,255,0.08); }
    .btn-download:active { transform: scale(0.97); }

    .btn-dev {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      box-shadow: 0 4px 14px rgba(59,130,246,0.35);
    }
    .btn-prod {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #fff;
      box-shadow: 0 4px 14px rgba(34,197,94,0.35);
    }
    .btn-download svg { flex-shrink: 0; }

    /* ─── View Details Button ────────────────────────────────────── */
    .btn-details {
      display: flex; align-items: center; justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(59,130,246,0.1));
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: var(--radius-xs);
      padding: 9px 14px;
      font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      color: #c4b5fd;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-details:hover {
      background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(59,130,246,0.2));
      border-color: rgba(139,92,246,0.5);
    }
    .btn-details svg { flex-shrink: 0; width: 14px; height: 14px; }

    /* ─── Card Footer ────────────────────────────────────────────── */
    .card-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      margin: 0;
    }
    .status-ok {
      display: flex; align-items: center; gap: 5px;
      color: var(--accent-green);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-ok svg { flex-shrink: 0; }
    .btn-play {
      display: flex; align-items: center; gap: 5px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .btn-play:hover {
      background: rgba(59,130,246,0.25);
      border-color: rgba(59,130,246,0.5);
    }
    .btn-play svg { flex-shrink: 0; width: 11px; height: 11px; }
    .badge-soon {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* ─── Modal Gallery ──────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.show { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 900px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 24px;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      z-index: 1001;
    }
    .modal-close:hover { color: var(--text); }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-title img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .modal-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .modal-gallery img {
      width: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .modal-gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(59,130,246,0.3);
    }

    .modal-description {
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .modal-description h3 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .modal-description p {
      font-size: 14px;
      color: var(--text-faint);
      line-height: 1.6;
    }

    /* ─── Empty State ───────────────────────────────────────────── */
    #emptyState {
      display: none;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    #emptyState svg {
      width: 48px; height: 48px; margin-bottom: 20px; opacity: 0.5;
    }
    #emptyState p { font-size: 16px; font-weight: 500; }

    /* ─── Footer ────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }
    footer a {
      color: var(--accent-blue);
      text-decoration: none;
      transition: color 0.2s;
    }
    footer a:hover { color: var(--accent-pur); }

    /* ─── Responsive ────────────────────────────────────────────── */
    @media (max-width: 640px) {
      #appGrid {
        grid-template-columns: 1fr;
      }
      .modal-content {
        width: 95%;
        padding: 16px;
      }
      .modal-gallery {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <header>
    <div class="header-badge">
      <span class="dot"></span>
      CI/CD Auto Build Active
    </div>
    <h1>📱 App Release Hub</h1>
    <p>Tải bản & APK mới nhất. Tự động build từ GitHub Actions mỗi khi có commit.</p>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-dot green"></span>
        <span>Live builds sẵn sàng</span>
      </div>
      <div class="stat">
        <span class="stat-dot blue"></span>
        <span>Dev builds tự động</span>
      </div>
      <div class="stat">
        <span id="appCount"></span>
      </div>
    </div>
  </header>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Tìm ứng dụng..." oninput="filterApps()" />
    </div>
  </div>

  <!-- App Grid -->
  <div id="appGrid"></div>
  <div id="emptyState">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <p>Không tìm thấy ứng dụng nào</p>
  </div>

</div>

<!-- Gallery Modal -->
<div id="galleryModal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-title">
      <img id="modalAppIcon" src="" alt="App Icon" style="display:none;" />
      <span id="modalAppName"></span>
    </div>
    <div class="modal-gallery" id="modalGallery"></div>
    <div class="modal-description" id="modalDescription"></div>
  </div>
</div>

<!-- Footer -->
<footer>
  <p>Auto-built by <a href="https://github.com/features/actions" target="_blank">GitHub Actions</a> · Hosted on <a href="https://pages.github.com" target="_blank">GitHub Pages</a></p>
</footer>

<script>
  /* ═══════════════════════════════════════════════════════════════
   *  ⚙️  CẤU HÌNH — Chỉ cần sửa phần này!
   * ═══════════════════════════════════════════════════════════════ */
  const RELEASE_REPO = "app-releases";
  const GITHUB_USER  = "kiennhe06";

  const APPS = [
    {
      id: "flashcore",
      name: "flashcore",
      icon: "https://playscore-42bfa.web.app/logo.png",
      repo: "tyso",
      prodUrl:   "https://playscore-42bfa.web.app",
      prodLabel: "👁 Xem chi tiết",
      prodDesc:  "Bản chính thức · luôn cập nhật mới nhất",
      playStoreUrl: null,
      // ─── THÊMỚI: Screenshots + Description ───
      screenshots: [
        "https://via.placeholder.com/400x800/1a2236/3b82f6?text=Flashcore+1",
        "https://via.placeholder.com/400x800/1a2236/3b82f6?text=Flashcore+2",
        "https://via.placeholder.com/400x800/1a2236/3b82f6?text=Flashcore+3",
      ],
      description: "Flashcore là ứng dụng xem bóng đá trực tiếp với giao diện hiện đại, theo dõi bàn thắng, thống kê chi tiết các đội bóng yêu thích.",
    },

    {
      id: "vidora",
      name: "Vidora",
      icon: "https://kiennhe06.github.io/app-releases/vidora-logo.png",
      repo: RELEASE_REPO,
      prodUrl:   "https://kiennhe06.github.io/app-releases/vidora/",
      prodLabel: "👁 Xem chi tiết",
      prodDesc:  "Tạo video AI · xem ảnh & tải bản mới",
      playStoreUrl: null,
      // ─── THÊMỚI: Screenshots + Description ───
      screenshots: [
        "https://via.placeholder.com/400x800/1a2236/8b5cf6?text=Vidora+Text-to-Video",
        "https://via.placeholder.com/400x800/1a2236/8b5cf6?text=Vidora+Face+Swap",
        "https://via.placeholder.com/400x800/1a2236/8b5cf6?text=Vidora+Gallery",
      ],
      description: "Vidora là công cụ AI tạo video từ văn bản, ghép mặt vào 1900+ mẫu, đổi mặt thông minh, tạo ảnh AI. Hoàn toàn miễn phí.",
    },
  ];

  /* ═══════════════════════════════════════════════════════════════ */

  function ghLink(app, tag, file) {
    return `https://github.com/${GITHUB_USER}/${app.repo}/releases/download/${tag}/${file}`;
  }

  function openModal(appId) {
    const app = APPS.find(a => a.id === appId);
    if (!app || !app.screenshots) return;

    document.getElementById('modalAppName').textContent = app.name;
    const icon = document.getElementById('modalAppIcon');
    if (app.icon && (app.icon.startsWith('http') || app.icon.startsWith('/'))) {
      icon.src = app.icon;
      icon.style.display = 'block';
    } else {
      icon.style.display = 'none';
    }

    const gallery = document.getElementById('modalGallery');
    gallery.innerHTML = app.screenshots.map(src => 
      `<img src="${src}" alt="Screenshot" onclick="openFullscreen('${src}')" />`
    ).join('');

    const desc = document.getElementById('modalDescription');
    desc.innerHTML = `
      <h3>📝 Mô tả</h3>
      <p>${app.description || 'Không có mô tả'}</p>
    `;

    document.getElementById('galleryModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('galleryModal').classList.remove('show');
    document.body.style.overflow = 'auto';
  }

  function openFullscreen(src) {
    const w = window.open();
    w.document.write(`<img src="${src}" style="max-width:100%; height:auto;" />`);
  }

  function renderCard(app, idx) {
    const devUrl  = app.devFile ? ghLink(app, app.devTag, app.devFile) : null;
    const prodUrl = app.prodUrl || ghLink(app, app.prodTag, app.prodFile);
    const hasDev  = !!devUrl;
    const prodLabel = app.prodLabel || 'Tải Live APK';
    const prodDesc  = app.prodDesc  || `branch: main / tag: ${app.prodTag}`;
    const repoUrl = `https://github.com/${GITHUB_USER}/${app.repo}`;

    const isImg = app.icon && (app.icon.startsWith('http') || app.icon.startsWith('/'));
    const iconHtml = isImg
      ? `<img src="${app.icon}" alt="${app.name}" />`
      : app.icon;

    // ─── THÊMỚI: Screenshots Preview ───
    const screenshotsHtml = app.screenshots && app.screenshots.length > 0
      ? `
        <div style="margin: 8px 0;">
          <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">📸 Hình ảnh</p>
          <div class="screenshots-preview">
            ${app.screenshots.slice(0, 4).map(src => 
              `<div class="screenshot-thumb" onclick="openModal('${app.id}')"><img src="${src}" alt="Screenshot" /></div>`
            ).join('')}
            ${app.screenshots.length > 4 ? `<div style="width:50px;height:80px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px;font-weight:600;">+${app.screenshots.length - 4}</div>` : ''}
          </div>
        </div>
      `
      : '';

    return `
    <div class="app-card" style="animation-delay:${idx * 0.07}s" data-name="${app.name.toLowerCase()}">
      <div class="card-header">
        <div class="app-icon">${iconHtml}</div>
        <div class="app-info">
          <div class="app-name">${app.name}</div>
          <div class="app-meta">
            <span class="badge badge-android">⬡ Android</span>
            <a class="badge badge-repo" href="${repoUrl}" target="_blank">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
              </svg>
              ${app.repo}
            </a>
          </div>
        </div>
      </div>

      ${screenshotsHtml}

      <div class="builds-row${hasDev ? '' : ' single'}">
        ${hasDev ? `
        <div class="build-item">
          <div class="build-label">
            <span class="indicator dev"></span>
            Dev Build
          </div>
          <div class="build-version">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
            </svg>
            branch: develop / tag: ${app.devTag}
          </div>
          <a class="btn-download btn-dev" href="${devUrl}" id="dev-${app.id}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Tải Dev APK
          </a>
        </div>` : ''}

        <div class="build-item">
          <div class="build-label">
            <span class="indicator prod"></span>
            Live Build
          </div>
          <div class="build-version">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
            </svg>
            ${prodDesc}
          </div>
          <a class="btn-download btn-prod" href="${prodUrl}"${app.prodUrl ? ' target="_blank"' : ''} id="prod-${app.id}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            ${prodLabel}
          </a>
        </div>
      </div>

      ${app.screenshots ? `
        <button class="btn-details" onclick="openModal('${app.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          Xem chi tiết hình ảnh
        </button>
      ` : ''}

      <div class="card-footer">
        <span class="status-ok">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          CI/CD Active
        </span>
        ${app.playStoreUrl
          ? `<a class="btn-play" href="${app.playStoreUrl}" target="_blank">
               <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5v-17c0-.83 1-.83 1.5-.5l15 8.5-15 8.5C3.5 20.5 3 20.5 3 20.5z"/></svg>
               Google Play
             </a>`
          : `<span class="badge-soon">⏳ Chưa có trên Store</span>`
        }
      </div>
    </div>`;
  }

  function renderAll(list) {
    const grid = document.getElementById('appGrid');
    const empty = document.getElementById('emptyState');
    if (list.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
    } else {
      grid.innerHTML = list.map((app, i) => renderCard(app, i)).join('');
      empty.style.display = 'none';
    }
  }

  function filterApps() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtered = q ? APPS.filter(a => a.name.toLowerCase().includes(q)) : APPS;
    renderAll(filtered);
  }

  // Close modal khi click ngoài
  document.getElementById('galleryModal').addEventListener('click', (e) => {
    if (e.target.id === 'galleryModal') closeModal();
  });

  // Init
  document.getElementById('appCount').innerHTML = `<span>${APPS.length} ứng dụng</span>`;
  renderAll(APPS);
</script>
</body>
</html>
