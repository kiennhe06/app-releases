:root{--bg:#080E1A;--bg2:#0E1929;--tx:#EAF2FF;--mut:#8DAFC9;--v:#6D3BD7;--c:#03B5D3;--cy:#4CD7F6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(120% 60% at 50% -10%,#12305c 0%,#080E1A 60%);color:var(--tx);font-family:-apple-system,'Segoe UI',Roboto,'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;text-align:center;overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px 64px}
.brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:56px}
.logo{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;box-shadow:0 8px 28px rgba(109,59,215,.45)}
.logo svg{width:26px;height:26px;fill:#fff}

.sub{color:var(--mut);font-size:clamp(16px,4.4vw,20px);margin:22px auto 40px;max-width:26ch;line-height:1.5}
.cta{display:inline-flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--v),var(--c));color:#fff;font-size:20px;font-weight:700;text-decoration:none;padding:20px 40px;border-radius:20px;box-shadow:0 12px 40px rgba(76,215,246,.35);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 50px rgba(76,215,246,.5)}
.cta svg{width:24px;height:24px;fill:#fff}
.note{color:var(--mut);font-size:15px;margin-top:18px}
.shots{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:64px 20px 20px;margin:0 -20px;-ms-overflow-style:none;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.frame{flex:0 0 auto;scroll-snap-align:center;width:250px}
.frame img{width:100%;border-radius:26px;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.6);cursor:zoom-in;display:block}
.frame figcaption{color:var(--mut);font-size:14px;margin-top:14px;font-weight:600}
.feats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:40px}
.chip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--tx);padding:9px 16px;border-radius:999px;font-size:14px}
footer{color:#4D6880;font-size:13px;margin-top:56px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:24px}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:88vh;border-radius:20px}
